services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uniclyst
      POSTGRES_PASSWORD: uniclyst
      POSTGRES_DB: uniclyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniclyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://uniclyst:uniclyst@db:5432/uniclyst
      JWT_SECRET: change-me-in-production-use-long-random-string
      CORS_ORIGINS: http://localhost:5173
      AUTO_CREATE_TABLES: "1"
      AUTO_SEED: "1"
      # TINYFISH_API_KEY: sk-tinyfish-...   # enable live Community Scout
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
