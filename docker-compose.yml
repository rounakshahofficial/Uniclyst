# Local development / demo stack.
# Secrets come from the environment (.env) — nothing sensitive is hardcoded.
# Copy .env.example → .env first. In production use your platform's secret
# manager and set AUTO_CREATE_TABLES=0 AUTO_SEED=0 (run migrations instead).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniclyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uniclyst}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uniclyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uniclyst}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-uniclyst}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Migrations-first posture in containerized deployments:
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-0}
      # Demo seed data is OFF unless you explicitly opt in:
      AUTO_SEED: ${AUTO_SEED:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
